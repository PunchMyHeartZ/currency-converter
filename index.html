<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เครื่องมือแปลงสกุลเงิน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { corePlugins: { preflight: false } };
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-800 py-5 py-md-5 position-relative">
  <div class="position-fixed top-0 start-0 w-100 h-100 overflow-hidden" style="z-index: 0; pointer-events: none;">
    <div class="position-absolute rounded-circle" style="width: 320px; height: 320px; top: -90px; right: -70px; background: rgba(56, 189, 248, 0.25); filter: blur(90px);"></div>
    <div class="position-absolute rounded-circle" style="width: 280px; height: 280px; bottom: -80px; left: -70px; background: rgba(168, 85, 247, 0.25); filter: blur(90px);"></div>
    <div class="position-absolute rounded-circle d-none d-lg-block" style="width: 200px; height: 200px; top: 40%; left: 55%; background: rgba(45, 212, 191, 0.15); filter: blur(80px);"></div>
  </div>

  <div class="container position-relative" style="z-index: 1;">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <div class="card border-0 rounded-4 shadow-lg" style="background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px);">
          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
              <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mb-3" style="width: 60px; height: 60px;">
                <i class="bi bi-currency-exchange fs-3"></i>
              </div>
              <h1 class="h4 fw-bold mb-1 text-dark">เครื่องมือแปลงสกุลเงิน</h1>
              <p class="text-muted small mb-0">
                แปลงค่าแบบสองทิศทาง
              </p>
            </div>

            <label for="amount-one" class="form-label small fw-semibold text-secondary">ช่องต้นทาง (amount-one)</label>
            <div class="input-group input-group-lg mb-1 shadow-sm rounded-3">
              <input type="number" id="amount-one" class="form-control border-end-0" placeholder="0.00" min="0" step="0.01">
              <select id="currency-one" class="form-select fw-semibold" style="max-width: 110px;">
                <option value="THB" selected>THB</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="JPY">JPY</option>
                <option value="CNY">CNY</option>
                <option value="KRW">KRW</option>
              </select>
            </div>

            <div class="text-center my-3">
              <button class="btn btn-outline-primary swap-btn shadow-sm" id="btn-swap" type="button" aria-label="สลับสกุลเงิน" title="สลับสกุลเงิน">
                <i class="bi bi-arrow-left-right"></i>
              </button>
            </div>

            <label for="amount-two" class="form-label small fw-semibold text-secondary">ช่องปลายทาง (amount-two)</label>
            <div class="input-group input-group-lg mb-4 shadow-sm rounded-3">
              <input type="number" id="amount-two" class="form-control border-end-0" placeholder="0.00" min="0" step="0.01">
              <select id="currency-two" class="form-select fw-semibold" style="max-width: 110px;">
                <option value="USD" selected>USD</option>
                <option value="THB">THB</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="JPY">JPY</option>
                <option value="CNY">CNY</option>
                <option value="KRW">KRW</option>
              </select>
            </div>

            <div class="d-flex align-items-center justify-content-center gap-2 bg-info-subtle rounded-3 py-3 mb-4" id="rate-text">
              1 THB = <span class="badge rounded-pill text-bg-success ms-1">0.02817 USD</span>
            </div>

            <div class="d-grid gap-3">
              <button class="btn btn-success btn-lg rounded-3 shadow-sm" id="btn-convert" type="button">
                <i class="bi bi-arrow-right-circle me-2"></i>แปลงเงิน
              </button>
              <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary flex-grow-1 rounded-3" id="btn-clear" type="button">
                  <i class="bi bi-eraser me-1"></i>ล้างข้อมูล
                </button>
                <button class="btn btn-outline-danger flex-grow-1 rounded-3" id="btn-history-clear" type="button">
                  <i class="bi bi-trash me-1"></i>ล้างประวัติ
                </button>
              </div>
            </div>

            <p class="text-center text-muted small mt-4 mb-0" id="updated-text">
              <i class="bi bi-clock-history me-1"></i>อัปเดตล่าสุด: -
            </p>
          </div>
        </div>

        <div class="card border-0 rounded-4 shadow-lg mt-4" style="background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px);">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h6 fw-bold mb-0 text-dark">
                <i class="bi bi-journal-text me-2 text-primary"></i>ประวัติการแปลงเงินย้อนหลัง 10 รายการล่าสุด
              </h2>
            </div>
            <ul class="list-group list-group-flush rounded-3 overflow-hidden" id="history-list"></ul>
            <p class="text-center text-muted small py-3 mb-0" id="history-empty">
              <i class="bi bi-inbox me-1"></i>ยังไม่มีประวัติการแปลงเงิน
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
